    <script>
        // Carrinho de compras
        let cart = [];
        const cartCount = document.getElementById('cart-count');
        const cartItems = document.getElementById('carrinho-itens');
        const emptyCart = document.getElementById('carrinho-vazio');
        const totalPrice = document.getElementById('total-preco');
        const checkoutBtn = document.getElementById('finalizar-compra');

        // Adicionar produto ao carrinho
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(this);
                const productId = formData.get('id_produto');
                const productPrice = parseFloat(formData.get('valor'));
                const productName = this.querySelector('p').textContent;
                const productImg = this.querySelector('img').src;
                
                addToCart(productId, productName, productPrice, productImg);
            });
        });

        function addToCart(id, name, price, img) {
            // Verifica se o produto já está no carrinho
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id,
                    name,
                    price,
                    img,
                    quantity: 1
                });
            }
            
            updateCart();
        }

        function updateCart() {
            // Atualiza contador do carrinho
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;
            
            // Atualiza lista de itens
            cartItems.innerHTML = '';
            
            if (cart.length === 0) {
                emptyCart.style.display = 'block';
                checkoutBtn.style.display = 'none';
            } else {
                emptyCart.style.display = 'none';
                checkoutBtn.style.display = 'block';
                
                cart.forEach(item => {
                    const cartItem = document.createElement('div');
                    cartItem.className = 'cart-item';
                    cartItem.innerHTML = `
                        <div class="cart-item-img">
                            <img src="${item.img}" alt="${item.name}">
                        </div>
                        <div class="cart-item-info">
                            <h4 class="mb-1">${item.name}</h4>
                            <p class="cart-item-price m-0">R$ ${item.price.toFixed(2)} x ${item.quantity}</p>
                        </div>
                        <i class="fas fa-trash" onclick="removeFromCart('${item.id}')"></i>
                    `;
                    cartItems.appendChild(cartItem);
                });
            }
            
            // Atualiza total
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            totalPrice.textContent = `R$ ${total.toFixed(2)}`;
        }

        function removeFromCart(id) {
            const itemIndex = cart.findIndex(item => item.id === id);
            
            if (itemIndex !== -1) {
                if (cart[itemIndex].quantity > 1) {
                    cart[itemIndex].quantity -= 1;
                } else {
                    cart.splice(itemIndex, 1);
                }
                
                updateCart();
            }
        }

        function finalizarCompra() {
            if (cart.length === 0) {
                alert('Seu carrinho está vazio!');
                return;
            }
            
            alert('Compra finalizada com sucesso! Obrigado por escolher a Aline\'s Pizzaria!');
            cart = [];
            updateCart();
        }
    </script>

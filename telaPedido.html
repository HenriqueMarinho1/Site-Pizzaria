<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Meta tags obrigatórias -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/principal.css">
    
    <title>Aline`s Pizzaria</title>
</head>

<body>
    <!-- Navbar Bootstrap -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm py-3">
            <div class="container">
                <!-- Logo -->
                <a class="navbar-brand fw-bold fs-3" href="#">
                    <span class="text-success">Aline's</span> <span class="text-dark">Pizzaria</span>
                </a>
                
                <!-- Botão hamburguer -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Itens do menu -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-5">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="telaS.html">Sobre</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="telaPedido.html">Cardápio</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-success px-3 py-2" href="telaLC.html">Entrar</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    <!-- Carousel Bootstrap -->
    <section class="mt-5 pt-4">
        <div id="pizzaCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#pizzaCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#pizzaCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#pizzaCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <picture>
                        <source media="(max-width: 900px)" srcset="img/m1.png">
                        <img src="img/1.png" class="d-block w-100" alt="Slide 1">
                    </picture>
                </div>
                <div class="carousel-item">
                    <picture>
                        <source media="(max-width: 900px)" srcset="img/m2.png">
                        <img src="img/2.png" class="d-block w-100" alt="Slide 2">
                    </picture>
                </div>
                <div class="carousel-item">
                    <picture>
                        <source media="(max-width: 900px)" srcset="img/m3.png">
                        <img src="img/3.png" class="d-block w-100" alt="Slide 3">
                    </picture>
                </div>
            </div>
            
            <button class="carousel-control-prev" type="button" data-bs-target="#pizzaCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#pizzaCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
        </div>
    </section>
    
    <!-- Seção principal -->
    <main class="py-5">
        <section class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 text-center">
                    <h4 class="fs-2 mb-3">Faça o seu pedido aqui</h4>
                    <h1 class="display-5 fw-bold text-success mb-4">Aperte no botão abaixo</h1>
                    <p class="lead mb-4">Descubra os sabores incríveis da Aline's Pizzaria e Sabores! Cada fatia é uma celebração para compartilhar. Faça o seu pedido aqui e aperte no botão abaixo!</p>
                    <a href="fazerPedido.html" class="btn btn-warning btn-lg px-4 py-2 text-white fw-bold">Fazer o pedido</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Bootstrap Bundle com Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script  -->
    <script>
        // Configuração do carousel para troca automática a cada 7 segundos
        document.addEventListener('DOMContentLoaded', function() {
            const myCarousel = document.getElementById('pizzaCarousel');
            const carousel = new bootstrap.Carousel(myCarousel, {
                interval: 7000,
                wrap: true
            });
        });
    </script>
</body>
</html>
